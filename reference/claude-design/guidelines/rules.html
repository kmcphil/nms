<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-body)}.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);margin:0}</style></head><body><div style="display:grid;gap:20px">
<div><div style="border-bottom:2px solid var(--ink)"></div><p class="lbl" style="margin-top:8px">2px ink — structural, under every section opener</p></div>
<div><div style="border-bottom:1px solid var(--hairline)"></div><p class="lbl" style="margin-top:8px">1px hairline — between columns and list rows</p></div>
<div style="display:flex;gap:14px;align-items:center"><div style="width:90px;height:44px;background:var(--ghost);border:1px solid var(--hairline)"></div><p class="lbl" style="text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:12px;color:var(--caption)">Radius 0 everywhere. No drop shadows on UI — the one permitted shadow is 0 18px 48px rgba(20,17,16,.1) on photography.</p></div>
</div></body></html>
