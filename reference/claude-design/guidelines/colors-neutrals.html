<!-- @dsCard group="Colors" viewport="700x200" name="Neutrals" subtitle="Labels, captions, hairlines, ghost numerals" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-body)}.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);margin:0}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
<div style="display:grid;gap:6px"><div style="height:74px;background:#8A857C;border:1px solid var(--hairline)"></div><p class="lbl">Label muted</p><p class="lbl" style="color:var(--ink);letter-spacing:.06em">#8A857C</p><p class="lbl" style="text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:11px;color:var(--caption)">Datelines, kickers, prices</p></div>
<div style="display:grid;gap:6px"><div style="height:74px;background:#6A655D;border:1px solid var(--hairline)"></div><p class="lbl">Caption grey</p><p class="lbl" style="color:var(--ink);letter-spacing:.06em">#6A655D</p><p class="lbl" style="text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:11px;color:var(--caption)">Photo captions</p></div>
<div style="display:grid;gap:6px"><div style="height:74px;background:#E6E4E0;border:1px solid var(--hairline)"></div><p class="lbl">Hairline</p><p class="lbl" style="color:var(--ink);letter-spacing:.06em">#E6E4E0</p><p class="lbl" style="text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:11px;color:var(--caption)">1px rules between columns</p></div>
<div style="display:grid;gap:6px"><div style="height:74px;background:#F0EFEC;border:1px solid var(--hairline)"></div><p class="lbl">Ghost numeral</p><p class="lbl" style="color:var(--ink);letter-spacing:.06em">#F0EFEC</p><p class="lbl" style="text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:11px;color:var(--caption)">Oversized framework numerals</p></div>
</div></body></html>
