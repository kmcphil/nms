<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-body)}.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);margin:0}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px">

<div style="display:grid;gap:6px"><div style="height:74px;background:#FFFFFF;border:1px solid var(--hairline)"></div><p class="lbl">Brand white</p><p class="lbl" style="color:var(--ink);letter-spacing:.06em">#FFFFFF</p><p class="lbl" style="text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:11px;color:var(--caption)">Page, logo on dark</p></div>
</div></body></html>
