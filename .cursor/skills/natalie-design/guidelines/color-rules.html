<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-body)}.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);margin:0}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:26px;font-size:13px;line-height:1.7;color:var(--body)">
<div><p class="lbl" style="color:var(--red)">Allowed</p><ul style="margin:8px 0 0;padding-left:18px"><li>Sequence numbers (01 · 02 · 03)</li><li>Links and actions</li><li>Set-pieces (marquee, growth arc)</li><li><strong>Exactly one</strong> full red panel per page</li></ul></div>
<div><p class="lbl">Banned</p><ul style="margin:8px 0 0;padding-left:18px;color:var(--label)"><li>Kickers and italic asides</li><li>Body copy</li><li>Headlines</li><li>Decorative dots and rules</li><li>Two red panels on one page</li></ul></div>
</div></body></html>
