<!-- @dsCard group="Colors" viewport="700x200" name="Web palette" subtitle="Brand System V1 — the values the site is actually built on" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-body)}.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);margin:0}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px">
<div style="display:grid;gap:6px"><div style="height:74px;background:#C20000;border:1px solid var(--hairline)"></div><p class="lbl">Signature red</p><p class="lbl" style="color:var(--ink);letter-spacing:.06em">#C20000</p><p class="lbl" style="text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:11px;color:var(--caption)">Sequence + action only</p></div>
<div style="display:grid;gap:6px"><div style="height:74px;background:#141110;border:1px solid var(--hairline)"></div><p class="lbl">Ink</p><p class="lbl" style="color:var(--ink);letter-spacing:.06em">#141110</p><p class="lbl" style="text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:11px;color:var(--caption)">Headlines, 2px rules</p></div>
<div style="display:grid;gap:6px"><div style="height:74px;background:#3A3631;border:1px solid var(--hairline)"></div><p class="lbl">Body</p><p class="lbl" style="color:var(--ink);letter-spacing:.06em">#3A3631</p><p class="lbl" style="text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:11px;color:var(--caption)">Body copy on white</p></div>
<div style="display:grid;gap:6px"><div style="height:74px;background:#F4EDE1;border:1px solid var(--hairline)"></div><p class="lbl">Cream</p><p class="lbl" style="color:var(--ink);letter-spacing:.06em">#F4EDE1</p><p class="lbl" style="text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:11px;color:var(--caption)">On red or ink only</p></div>
<div style="display:grid;gap:6px"><div style="height:74px;background:#0D0D0D;border:1px solid var(--hairline)"></div><p class="lbl">Night</p><p class="lbl" style="color:var(--ink);letter-spacing:.06em">#0D0D0D</p><p class="lbl" style="text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:11px;color:var(--caption)">Dark problem section</p></div>
</div></body></html>
