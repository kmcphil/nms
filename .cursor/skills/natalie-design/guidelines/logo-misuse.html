<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-body)}.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);margin:0}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;font-family:var(--font-body);font-size:12px;color:var(--body)">
<div style="display:grid;gap:8px;justify-items:center;border:1px solid var(--hairline);padding:14px;position:relative"><img src="../assets/logos/logo-horizontal-black.svg" style="width:110px;transform:scaleX(1.4)"><span style="color:var(--red);font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase">Don’t — Stretch or distort</span></div><div style="display:grid;gap:8px;justify-items:center;border:1px solid var(--hairline);padding:14px;position:relative"><img src="../assets/logos/logo-horizontal-black.svg" style="width:110px;transform:rotate(-8deg)"><span style="color:var(--red);font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase">Don’t — Rotate or tilt</span></div><div style="display:grid;gap:8px;justify-items:center;border:1px solid var(--hairline);padding:14px;position:relative"><img src="../assets/logos/logo-horizontal-black.svg" style="width:110px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))"><span style="color:var(--red);font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase">Don’t — Add shadows or effects</span></div><div style="display:grid;gap:8px;justify-items:center;border:1px solid var(--hairline);padding:14px;position:relative"><img src="../assets/logos/logo-horizontal-black.svg" style="width:110px;filter:hue-rotate(140deg) saturate(3)"><span style="color:var(--red);font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase">Don’t — Off-brand colors</span></div><div style="display:grid;gap:8px;justify-items:center;border:1px solid var(--hairline);padding:14px;position:relative"><img src="../assets/logos/logo-horizontal-black.svg" style="width:110px;opacity:.6"><span style="color:var(--red);font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase">Don’t — Busy backgrounds</span></div><div style="display:grid;gap:8px;justify-items:center;border:1px solid var(--hairline);padding:14px;position:relative"><span style="font-family:Georgia,serif;font-size:15px;color:var(--ink)">Natalie Micale Schultz</span><span style="color:var(--red);font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase">Don’t — Retype in another font</span></div>
</div></body></html>
